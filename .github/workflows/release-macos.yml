name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  # Manual runs build, sign, and notarize the DMG but only store it as a
  # workflow artifact; they never touch a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build and upload DMG
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        shell: bash
        run: swift --version

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(tr -d '[:space:]' < VERSION)"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $package_version"
            exit 1
          fi

      - name: Verify source
        shell: bash
        run: ./script/verify.sh

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_SIGNING_P12" ]]; then
            echo "::notice::MACOS_SIGNING_P12 is not set; the DMG will be ad-hoc signed"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/signing.p12"

          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode >"$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_SIGNING_PASSWORD" -f pkcs12 \
            -k "$keychain" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep '"Developer ID Application: ' | head -n 1 | awk '{print $2}' || true)"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_SIGNING_P12 does not contain a Developer ID Application identity"
            exit 1
          fi

          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Build DMG
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          signing="ad-hoc"
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            signing="developer-id"
            if [[ -n "$APPLE_API_KEY_P8_BASE64" ]]; then
              signing="notarized"
              export NOTARIZE=1
            else
              echo "::notice::APPLE_API_KEY_P8_BASE64 is not set; the DMG will not be notarized"
            fi
          else
            # Never pick up an identity that happens to exist on the runner.
            export CODESIGN_IDENTITY=-
          fi

          echo "RELEASE_SIGNING=$signing" >>"$GITHUB_ENV"
          ./script/package_macos.sh

      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.dmg)

          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one DMG in dist, found ${#artifacts[@]}"
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi

          hdiutil verify "${artifacts[0]}"

      - name: Generate signed Sparkle appcast
        if: github.event_name == 'push'
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY must contain the exported EdDSA key}"
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/sparkle-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" >"$key_file"
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$key_file" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --maximum-deltas 0 \
            -o dist/appcast.xml dist

      - name: Upload DMG artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TeleMessEnd-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="$GITHUB_REF_NAME"
          artifacts=(dist/*.dmg)
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one DMG in dist, found ${#artifacts[@]}"
            exit 1
          fi

          artifacts+=(dist/appcast.xml)

          {
            printf '%s\n' "Automated macOS DMG build."
            printf '\n'
            case "$RELEASE_SIGNING" in
              notarized)
                printf '%s\n' "This build is signed with a Developer ID certificate and notarized by Apple."
                ;;
              developer-id)
                printf '%s\n' "This build is signed with a Developer ID certificate but not notarized. macOS Gatekeeper may require right-click Open or approval in Privacy & Security."
                ;;
              *)
                printf '%s\n' "This build is ad-hoc signed and not notarized. macOS Gatekeeper may require right-click Open or approval in Privacy & Security."
                ;;
            esac
          } >"$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" --title "$tag" --notes-file "$notes_file"
          fi
